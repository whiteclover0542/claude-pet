<!DOCTYPE html>
<html>
<body>
<script>
const { ipcRenderer } = require('electron');
const path = require('path');

const SHEET = path.join(__dirname, '..', 'assets', 'characters', 'mong-sheet.png');
const params = new URLSearchParams(location.search);
const px = Number(params.get('x'));
const py = Number(params.get('y'));

(async () => {
  try {
    const img = new Image();
    img.src = `file:///${SHEET.replace(/\\/g, '/')}`;
    await img.decode();
    const cv = document.createElement('canvas');
    cv.width = img.naturalWidth;
    cv.height = img.naturalHeight;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    const out = [];
    for (let dy = -3; dy <= 3; dy++) {
      const row = [];
      for (let dx = -3; dx <= 3; dx++) {
        const d = ctx.getImageData(px + dx, py + dy, 1, 1).data;
        row.push(`(${d[0]},${d[1]},${d[2]},a${d[3]})`);
      }
      out.push(row.join(' '));
    }
    ipcRenderer.send('result', out.join('\n'));
  } catch (e) {
    ipcRenderer.send('result', 'ERROR ' + (e && e.stack || e));
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<script>
const { ipcRenderer } = require('electron');
const path = require('path');
const fs = require('fs');

const SHEET = path.join(__dirname, '..', 'assets', 'characters', 'mong-sheet.png');
const BOXES = path.join(__dirname, 'sheet-boxes.json');
const SCALE = 3;
const GAP = 12;

const params = new URLSearchParams(location.search);
const rowIndex = Number(params.get('row') || 4);

(async () => {
  try {
    const meta = JSON.parse(fs.readFileSync(BOXES, 'utf-8'));
    const row = meta.rows[rowIndex];
    const img = new Image();
    img.src = `file:///${SHEET.replace(/\\/g, '/')}`;
    await img.decode();

    const h = row.cellH * SCALE;
    const totalW = row.boxes.reduce((sum, b) => sum + b.w * SCALE + GAP, GAP);

    const cv = document.createElement('canvas');
    cv.width = totalW;
    cv.height = h + 40;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#20222a';
    ctx.fillRect(0, 0, cv.width, cv.height);

    let x = GAP;
    row.boxes.forEach((b, i) => {
      const w = b.w * SCALE;
      const bh = b.h * SCALE;
      ctx.drawImage(img, b.x, b.y, b.w, b.h, x, h - bh, w, bh);
      ctx.fillStyle = '#8ab4ff';
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText(String(i), x, h + 24);
      x += w + GAP;
    });

    ipcRenderer.send('png', cv.toDataURL('image/png'));
  } catch (e) {
    ipcRenderer.send('png', `ERR ${e && e.stack || e}`);
  }
})();
</script>
</body>
</html>

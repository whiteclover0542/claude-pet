<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Claude Pet</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <!-- 진행 중인 채팅을 보여주는 말풍선 (제목 + 상태, 답변이 오면 본문까지) -->
    <div id="bubble" class="hidden" data-hit>
      <div id="bubble-head">
        <span id="bubble-title">새 채팅</span>
        <span id="bubble-source"></span>
      </div>
      <div id="bubble-state">대기 중</div>
      <div id="bubble-body" class="hidden"></div>
      <div id="session-dots" class="hidden" title="다른 세션으로 전환"></div>
    </div>

    <div id="pet" data-hit>
      <canvas id="pet-canvas"></canvas>
    </div>

    <!-- 펫을 클릭하면 열리는 설정 패널 (크기 조절 + 캐릭터 선택) -->
    <div id="settings-panel" class="hidden" data-hit>
      <div class="settings-row">
        <span class="settings-label">크기</span>
        <button id="scale-down" type="button" aria-label="작게">−</button>
        <span id="scale-value">100%</span>
        <button id="scale-up" type="button" aria-label="크게">+</button>
      </div>
      <div class="settings-row">
        <span class="settings-label">캐릭터</span>
        <div id="character-list"></div>
      </div>
    </div>
  </div>

  <script src="sprite.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
